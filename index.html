<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the study screen can use the full display on notched phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Rewritten at boot by services/theme.js to match the chosen theme's surface. -->
    <meta name="theme-color" content="#111827" />
    <meta name="description" content="Flashcards you can study hands-free, by ear." />

    <!--
      Icons. Every path is relative, so they resolve under /smashcards/ in
      production and under the dev server's base without a second set of
      rules. They are generated by `node tools/make-icons.mjs`.

      Three formats because three consumers disagree: an SVG for browsers that
      will scale one, a 32px PNG and an .ico for those that will not, and
      apple-touch-icon for iOS, which ignores the manifest entirely when a page
      is added to the home screen.
    -->
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Smashcards" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <title>Smashcards</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
